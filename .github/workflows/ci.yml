name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Pinned by .nvmrc. The archive hash depends on Node's bundled zlib, so CI and
      # a release build must use the same major for their hashes to match.
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # Version drift across the three manifests is how a store update ends up
      # rejected for reusing a published version number.
      - name: Check version consistency
        run: npm run version:check

      # The repo ships a `format` script; without this the check drifts until it is
      # noise and nobody runs it.
      - name: Check formatting
        run: npm run format:check

      - run: npm run lint

      # test:coverage runs the same suite and additionally enforces the thresholds in
      # vitest.config.mjs.
      - run: npm run test:coverage

      # Builds both packages and fails on any store-policy violation
      # (remote code, eval, network APIs, unused permissions, missing references).
      - name: Build store packages
        run: npm run build

      # Mozilla's own validator (the one AMO runs on upload) over the Firefox tree.
      # Fetched on demand rather than as a devDependency: it is large and only this
      # step needs it. Warnings fail too — the package is currently clean.
      - name: Validate the Firefox package with web-ext lint
        run: npm run lint:firefox

      - name: Upload store packages
        uses: actions/upload-artifact@v7
        with:
          name: locatra-packages
          path: dist/*.zip
          if-no-files-found: error

  # The unit suites run in jsdom, which has no layout, no real message plumbing and no
  # frames. This job loads the built extension into a real browser and drives it: the
  # picker's hit testing, service-worker relays, iframe injection and multi-page
  # recording only exist here. It needs a display, hence xvfb.
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Pinned by .nvmrc. The archive hash depends on Node's bundled zlib, so CI and
      # a release build must use the same major for their hashes to match.
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - run: npm run build

      - name: Smoke test the built extension
        run: xvfb-run -a npm run smoke

      - name: Smoke test Page Object export
        run: xvfb-run -a npm run smoke:pom

      - name: Smoke test step screenshots
        run: xvfb-run -a npm run smoke:screenshots

      - name: Smoke test settings, shortcuts, health check and the Edge package
        run: xvfb-run -a npm run smoke:settings

      - name: Smoke test test-data variables and the Health tab
        run: xvfb-run -a npm run smoke:data-health

      - name: Smoke test frames addressed only by position (cross-origin parents)
        run: xvfb-run -a npm run smoke:frames

      # The runner image ships Firefox and geckodriver. $GECKOWEBDRIVER comes from the
      # image, not the workflow, so only the shell sees it (the `env` context does
      # not). Headless, so no xvfb. LOCATRA_REQUIRE_FIREFOX turns "not found" into a
      # failure instead of a skip.
      - name: Smoke test the Firefox package in Firefox
        env:
          LOCATRA_REQUIRE_FIREFOX: '1'
        run: LOCATRA_GECKODRIVER="$GECKOWEBDRIVER/geckodriver" npm run smoke:firefox

  # The exported tests, run for real. Unit suites only prove generated code parses;
  # these run every Playwright and Selenium export (TypeScript, JavaScript, Python)
  # in its own real runner against the demo checkout, for a canonical stored flow
  # and for a flow recorded through the built extension, and check that the demo
  # server received the order each flow places. --require makes a runner that could
  # not start a failure here rather than a silent skip.
  exports:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tests/e2e/requirements.txt

      - run: npm ci

      - name: Install the Python packages the Python exports import
        run: python -m pip install -r tests/e2e/requirements.txt

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ms-playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      # Every framework drives this one Chromium (Selenium Manager fetches the
      # matching chromedriver; pytest-playwright is pointed at it by a conftest).
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - run: npm run build

      # Recording through the extension needs a headed browser, hence xvfb.
      - name: Run every Playwright and Selenium export for real
        run: >-
          xvfb-run -a npm run test:exports --
          --only playwright-typescript,playwright-javascript,playwright-python,selenium-typescript,selenium-javascript,selenium-python
          --require playwright-typescript,playwright-javascript,playwright-python,selenium-typescript,selenium-javascript,selenium-python

      - name: Upload generated scripts and runner logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: exports-playwright-selenium
          path: .tmp-exports/
          if-no-files-found: ignore

  # Cypress gets its own job: its binary is large, so it is not a devDependency and
  # every other job stays fast. Installed here (with cypress-real-events, which
  # exported Shift+Tab/combo key presses import, and typescript for the .ts spec).
  exports-cypress:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Cache the Cypress binary
        uses: actions/cache@v4
        with:
          path: ~/.cache/Cypress
          key: cypress-${{ runner.os }}-${{ hashFiles('package.json') }}

      - name: Install Cypress, cypress-real-events and TypeScript
        run: npm run test:exports:setup-cypress

      - run: npx cypress verify

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ms-playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      # Only used to record the second flow through the extension.
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - run: npm run build

      - name: Run the Cypress exports for real (Electron)
        run: >-
          xvfb-run -a npm run test:exports --
          --only cypress-typescript,cypress-javascript
          --require cypress-typescript,cypress-javascript

      - name: Upload generated specs and runner logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: exports-cypress
          path: .tmp-exports/
          if-no-files-found: ignore

  # Java exports (Playwright for Java, Selenium for Java) run under JUnit 5 through
  # Maven, in a throwaway project around the unmodified generated file.
  exports-java:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      # No `cache: maven`: there is no pom.xml in the repo for it to key on.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ms-playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Cache the Maven repository
        uses: actions/cache@v4
        with:
          path: node_modules/.cache/locatra-e2e/java/m2
          key: m2-${{ runner.os }}-${{ hashFiles('scripts/e2e/setup-java.mjs') }}

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Resolve the Java test dependencies
        run: npm run test:exports:setup-java

      - run: npm run build

      - name: Run the Java exports for real
        run: >-
          xvfb-run -a npm run test:exports --
          --only playwright-java,selenium-java
          --require playwright-java,selenium-java

      - name: Upload generated scripts and runner logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: exports-java
          path: .tmp-exports/
          if-no-files-found: ignore

  # C# exports (Playwright for .NET, Selenium for C#) run under NUnit with
  # `dotnet test`, in a throwaway project around the unmodified generated file.
  exports-csharp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ms-playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: node_modules/.cache/locatra-e2e/nuget
          key: nuget-${{ runner.os }}-${{ hashFiles('scripts/e2e/runners/csharp.mjs') }}

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - run: npm run build

      - name: Run the C# exports for real
        run: >-
          xvfb-run -a npm run test:exports --
          --only playwright-csharp,selenium-csharp
          --require playwright-csharp,selenium-csharp

      - name: Upload generated scripts and runner logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: exports-csharp
          path: .tmp-exports/
          if-no-files-found: ignore

  # WebdriverIO exports (v9 + Mocha) run through the real wdio CLI, with packages
  # installed into a cache folder so the repo's package.json stays untouched.
  exports-webdriverio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ms-playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Cache the WebdriverIO packages and ChromeDriver
        uses: actions/cache@v4
        with:
          path: node_modules/.cache/locatra-e2e/wdio
          key: wdio-${{ runner.os }}-${{ hashFiles('scripts/e2e/setup-webdriverio.mjs') }}

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Install the WebdriverIO packages
        run: npm run test:exports:setup-webdriverio

      - run: npm run build

      - name: Run the WebdriverIO exports for real
        run: >-
          xvfb-run -a npm run test:exports --
          --only webdriverio-typescript,webdriverio-javascript
          --require webdriverio-typescript,webdriverio-javascript

      - name: Upload generated scripts and runner logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: exports-webdriverio
          path: .tmp-exports/
          if-no-files-found: ignore
