<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>LocatorLens</title>
  <style>
    /* LocatorLens — design tokens (matches the side panel: warm cream + deep teal). */
    :root,
    [data-theme="light"] {
      --bg:#F7F5EE;--canvas:#FAF9F5;--surface:#FFFFFF;--surface-2:#F2EFE6;--surface-3:#ECE8DC;--hover:#F0ECDF;--border:#E3DECF;--border-strong:#D2CCBA;
      --text:#1A1915;--text-strong:#100F0C;--text-muted:#6B665B;--text-faint:#948E80;
      --brand:#1F6A6F;--brand-strong:#155257;--brand-soft:#E3EEEE;--brand-soft-2:#CFE2E3;--on-brand:#FFFFFF;
      --success:#2F7A4E;--success-soft:#E0EFE5;--danger:#B83A2E;--danger-soft:#F7E1DD;
      --shadow-sm:0 1px 2px rgba(40,33,20,0.04);--shadow:0 1px 3px rgba(40,33,20,0.06),0 2px 8px rgba(40,33,20,0.04);--ring:0 0 0 3px rgba(31,106,111,0.18);
      --r-sm:6px;--r-md:8px;--r-lg:12px;--r-pill:999px;
    }
    [data-theme="dark"] {
      --bg:#1B1A17;--canvas:#201F1B;--surface:#26241F;--surface-2:#2E2C26;--surface-3:#36332C;--hover:#312E27;--border:#383530;--border-strong:#4A463E;
      --text:#ECE7DA;--text-strong:#FAF6EA;--text-muted:#9C968A;--text-faint:#6E695F;
      --brand:#6FB9BE;--brand-strong:#95D2D6;--brand-soft:#1F3536;--brand-soft-2:#28494B;--on-brand:#0F2425;
      --success:#7FBE9C;--success-soft:#1F3327;--danger:#E08A7E;--danger-soft:#3A2320;
      --shadow-sm:0 1px 2px rgba(0,0,0,0.3);--shadow:0 1px 3px rgba(0,0,0,0.4),0 2px 8px rgba(0,0,0,0.25);--ring:0 0 0 3px rgba(111,185,190,0.25);
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme]) {
        --bg:#1B1A17;--canvas:#201F1B;--surface:#26241F;--surface-2:#2E2C26;--surface-3:#36332C;--hover:#312E27;--border:#383530;--border-strong:#4A463E;
        --text:#ECE7DA;--text-strong:#FAF6EA;--text-muted:#9C968A;--text-faint:#6E695F;
        --brand:#6FB9BE;--brand-strong:#95D2D6;--brand-soft:#1F3536;--brand-soft-2:#28494B;--on-brand:#0F2425;
        --success:#7FBE9C;--success-soft:#1F3327;--danger:#E08A7E;--danger-soft:#3A2320;
      }
    }
    :root, [data-theme="light"], [data-theme="dark"] { --primary:var(--brand); --muted:var(--text-muted); --error:var(--danger); }

    *, *::before, *::after { box-sizing: border-box; }
    * { margin: 0; padding: 0; }
    body {
      width: 320px;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      font-size: 13px;
      -webkit-font-smoothing: antialiased;
    }
    button { font: inherit; color: inherit; cursor: pointer; border: none; background: none; }
    svg { flex-shrink: 0; }
    button:focus-visible { outline: 2px solid var(--brand-strong); outline-offset: 2px; }

    .header {
      display: flex; align-items: center; gap: 11px;
      padding: 12px 14px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
    }
    .brand-mark {
      width: 32px; height: 32px;
      display: inline-flex; align-items: center; justify-content: center;
      border-radius: var(--r-md);
      background: var(--brand-soft); color: var(--brand);
    }
    .brand-mark svg { width: 18px; height: 18px; }
    .brand { flex: 1; min-width: 0; }
    .brand-name { font-weight: 700; font-size: 14px; letter-spacing: -0.01em; color: var(--text-strong); }
    .brand-sub { font-size: 10px; color: var(--text-muted); margin-top: 1px; }
    .status-dot { width: 8px; height: 8px; border-radius: var(--r-pill); background: var(--text-faint); transition: background .2s ease, box-shadow .2s ease; }
    .status-dot.active { background: var(--success); box-shadow: 0 0 0 3px var(--success-soft); }

    .btn-wrap { padding: 14px; display: flex; flex-direction: column; gap: 10px; }
    .inspect-btn {
      width: 100%; min-height: 38px;
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      border: 1px solid var(--brand); border-radius: var(--r-md);
      background: var(--brand); color: var(--on-brand);
      padding: 9px 13px; font-weight: 700; font-size: 12px;
      box-shadow: var(--shadow-sm);
      transition: background .16s ease, border-color .16s ease, transform .16s ease;
    }
    .inspect-btn:hover { background: var(--brand-strong); border-color: var(--brand-strong); transform: translateY(-1px); }
    .inspect-btn:active { transform: translateY(0); }
    .inspect-btn.active { background: var(--danger-soft); color: var(--danger); border-color: var(--danger); box-shadow: none; }

    .panel-btn {
      width: 100%; min-height: 36px;
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      border: 1px solid var(--border); border-radius: var(--r-md);
      background: var(--surface); color: var(--text-muted);
      padding: 8px 13px; font-weight: 600; font-size: 11px;
      transition: background .16s ease, color .16s ease, border-color .16s ease;
    }
    .panel-btn:hover { background: var(--brand-soft); color: var(--brand); border-color: var(--brand-soft-2); }

    .hint-row {
      margin: 0 14px 10px;
      padding: 8px 10px;
      background: var(--surface-2); border: 1px solid var(--border); border-radius: var(--r-md);
      color: var(--text-muted); font-size: 11px; text-align: center;
      display: none;
    }
    .hint-row span { color: var(--brand); font-weight: 600; }

    .capabilities {
      margin: 0 14px 14px;
      background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-lg);
      box-shadow: var(--shadow-sm);
      padding: 6px;
    }
    .cap-row { display: flex; align-items: flex-start; gap: 11px; padding: 9px 8px; font-size: 11px; color: var(--text-muted); line-height: 1.45; }
    .cap-row + .cap-row { border-top: 1px solid var(--border); }
    .cap-icon {
      width: 26px; height: 26px; flex-shrink: 0;
      display: inline-flex; align-items: center; justify-content: center;
      border-radius: var(--r-md); background: var(--brand-soft); color: var(--brand);
    }
    .cap-icon svg { width: 14px; height: 14px; }
    .cap-label { display: block; font-weight: 700; color: var(--text-strong); margin-bottom: 1px; }
  </style>
</head>

<body>
  <div class="header">
    <div class="brand-mark" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
    </div>
    <div class="brand">
      <div class="brand-name">LocatorLens</div>
      <div class="brand-sub">Playwright locators · v1.1.6</div>
    </div>
    <div class="status-dot" id="statusDot" title="Inspector status"></div>
  </div>

  <div class="btn-wrap">
    <button class="inspect-btn" id="inspectBtn">
      <span id="btnIcon">🎯</span>
      <span id="btnText">Start Inspecting</span>
    </button>
    <button class="panel-btn" id="panelBtn">
      <span aria-hidden="true">▦</span>
      <span id="panelBtnText">Open Results Panel</span>
    </button>
  </div>
  <div class="hint-row" id="hintRow">
    Select a target · <span>▲▼ arrow to navigate</span> · <span>Esc to abort</span>
  </div>

  <div class="capabilities">
    <div class="cap-row">
      <span class="cap-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/><circle cx="12" cy="12" r="2" fill="currentColor"/></svg></span>
      <div><span class="cap-label">Inspect</span>Hover any element for ranked Playwright locators.</div>
    </div>
    <div class="cap-row">
      <span class="cap-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="3.5" fill="currentColor" stroke="none"/></svg></span>
      <div><span class="cap-label">Record</span>Capture a flow and export a Playwright test script.</div>
    </div>
    <div class="cap-row">
      <span class="cap-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg></span>
      <div><span class="cap-label">Local</span>Everything runs in your browser — nothing is sent away.</div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>

</html>
